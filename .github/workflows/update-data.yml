name: Actualizar datos

on:
  schedule:
    - cron: "17 8 * * *"   # diario, 08:17 UTC (03:17 Lima)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generar data/data.json
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/update_data.py
      - name: Salvaguarda - ningún repo privado en los datos
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/check_private_leak.py data/data.json data/cache.json
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/cache.json
          git diff --staged --quiet || (git commit -m "chore: actualiza data.json" && git push)
